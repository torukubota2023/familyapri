<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f3ec; --ink: #1d2433; --sub: #5b6475; --line: #d9d3c5;
    --buy: #c8553d; --rent: #2a6f97; --ok: #3a7d44; --warn: #b8860b; --cap: #1d2433;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: "IPAPGothic", "IPAGothic", "WenQuanYi Zen Hei", sans-serif; }
  .frame { position: absolute; inset: 0; padding: 56px 88px 0; }
  .page { position: absolute; top: 28px; right: 48px; font-size: 26px; color: var(--sub); }
  .brand { position: absolute; top: 28px; left: 88px; font-size: 24px; color: var(--sub); letter-spacing: .08em; }
  h1 { font-size: 64px; margin: 34px 0 26px; line-height: 1.25; }
  h1 small { display: block; font-size: 32px; color: var(--sub); font-weight: normal; margin-top: 10px; }
  .body { font-size: 38px; line-height: 1.55; }
  .cap { position: absolute; left: 0; right: 0; bottom: 0; min-height: 168px; background: var(--cap); color: #fff;
         font-size: 40px; line-height: 1.45; padding: 26px 96px; display: flex; align-items: center; }
  table { border-collapse: collapse; font-size: 34px; }
  th, td { border-bottom: 2px solid var(--line); padding: 10px 22px; text-align: right; }
  th { color: var(--sub); font-weight: normal; font-size: 28px; }
  td:first-child, th:first-child { text-align: left; }
  .buy { color: var(--buy); } .rent { color: var(--rent); } .ok { color: var(--ok); } .warn { color: var(--warn); }
  .big { font-size: 84px; font-weight: bold; }
  .card { background: #fff; border-radius: 18px; padding: 28px 36px; box-shadow: 0 2px 0 var(--line); }
  .row { display: flex; gap: 40px; }
  .col { flex: 1; }
  .tag { display: inline-block; font-size: 26px; padding: 4px 16px; border-radius: 999px; background: #ebe5d8; color: var(--sub); margin-right: 10px; }
  .note { font-size: 30px; color: var(--sub); margin-top: 18px; }
  ul.pts { list-style: none; } ul.pts li { margin: 14px 0; padding-left: 48px; position: relative; }
  ul.pts li::before { content: ""; position: absolute; left: 8px; top: 22px; width: 18px; height: 18px; border-radius: 50%; background: var(--buy); }
  ol.pts { padding-left: 60px; } ol.pts li { margin: 12px 0; }
  .hl { background: linear-gradient(transparent 60%, #f5d98b 60%); }
  td.on { background: #fff4d6; font-weight: bold; }
</style>
</head>
<body>
<div class="frame">
  <div class="brand">那覇・おもろまち｜賃貸か購入か</div>
  <div class="page">{{PAGE}}</div>
  {{BODY}}
</div>
<div class="cap">{{CAPTION}}</div>
<script>
  // data-s="n" の要素は、ナレーションの n 番目の文から表示する
  const STEP = {{STEP}};
  document.querySelectorAll('[data-s]').forEach(e => { if (+e.dataset.s > STEP) e.style.visibility = 'hidden'; });
</script>
</body>
</html>
